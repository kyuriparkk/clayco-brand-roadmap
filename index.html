<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clayco Brand Roadmap</title>
  <meta name="description" content="Live tracker for the Clayco enterprise brand project — research, strategy, design system, website, guidelines, implementation, and launch." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div class="header-top">
        <div class="title-block">
          <div>
            <h1>Clayco Brand Roadmap</h1>
          </div>
        </div>
      </div>

      <div class="status-strip">
        <div class="status-item">
          <span class="status-label">Current phase</span>
          <span class="status-value" id="stat-phase">—</span>
        </div>
        <div class="status-item">
          <span class="status-label">Overall completion</span>
          <span class="status-value accent-red" id="stat-progress">—</span>
        </div>
        <div class="status-item">
          <span class="status-label">Target launch</span>
          <span class="status-value" id="stat-launch">—</span>
        </div>
      </div>
    </div>
  </header>

  <section class="timeline-section">
    <div class="wrap">
      <div class="timeline-chart-wrap">
        <div class="timeline-scroll">
          <div id="timeline-chart-wrap"></div>
        </div>
      </div>

      <div id="mobile-list-wrap"></div>
    </div>
  </section>

  <footer class="site">
    <div class="wrap" style="display:flex; gap:18px; flex-wrap:wrap;">
      <span>Last updated <strong id="footer-updated"></strong></span>
      <span>Updated by <strong id="footer-updated-by"></strong></span>
    </div>
  </footer>

  <dialog id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-inner">
      <div class="drawer-header">
        <button class="drawer-close" id="drawer-close" aria-label="Close details">✕</button>
        <div id="drawer-header-content"></div>
      </div>
      <div class="drawer-body" id="drawer-body-content"></div>
    </div>
  </dialog>

  <!-- MSAL.js — only used if MS_GRAPH_CONFIG (roadmap-data.js) has a real
       clientId/tenantId; the app works fine without it. -->
  <script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
  <script src="roadmap-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
