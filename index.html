<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clayco Brand Roadmap</title>
  <meta name="description" content="Live tracker for the Clayco enterprise brand project — research, strategy, design system, website, guidelines, implementation, and launch." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <div class="header-top">
        <div class="title-block">
          <span class="accent-mark" aria-hidden="true"></span>
          <div>
            <h1>Clayco Brand Roadmap</h1>
            <p class="sub">Where the enterprise brand project stands, from research through launch.</p>
          </div>
        </div>
      </div>

      <div class="status-strip">
        <div class="status-item">
          <span class="status-label">Current phase</span>
          <span class="status-value" id="stat-phase">—</span>
        </div>
        <div class="status-item">
          <span class="status-label">Overall completion</span>
          <span class="status-value accent-red" id="stat-progress">—</span>
        </div>
        <div class="status-item">
          <span class="status-label">Project health</span>
          <span class="status-value" id="stat-health">—</span>
        </div>
        <div class="status-item">
          <span class="status-label">Target launch</span>
          <span class="status-value" id="stat-launch">—</span>
        </div>
        <div class="status-item">
          <span class="status-label">Last updated</span>
          <span class="status-value" id="stat-updated">—</span>
        </div>
      </div>
    </div>
  </header>

  <section class="timeline-section">
    <div class="wrap">
      <div class="section-head">
        <h2>10-Month Timeline</h2>
        <div class="legend">
          <span class="item"><span class="swatch done"></span>Complete</span>
          <span class="item"><span class="swatch active"></span>In progress</span>
          <span class="item"><span class="swatch todo"></span>Not started</span>
          <span class="item"><span class="swatch blocked"></span>Blocked / delayed</span>
        </div>
      </div>

      <div class="timeline-chart-wrap">
        <div class="timeline-scroll">
          <div id="timeline-chart-wrap"></div>
        </div>
      </div>

      <div id="mobile-list-wrap"></div>
    </div>
  </section>

  <footer class="site">
    <div class="wrap" style="display:flex; gap:18px; flex-wrap:wrap;">
      <span>Last updated <strong id="footer-updated"></strong></span>
      <span>Updated by <strong id="footer-updated-by"></strong></span>
      <span>Next update <strong id="footer-next-update"></strong></span>
    </div>
  </footer>

  <dialog id="drawer" aria-labelledby="drawer-title">
    <div class="drawer-inner">
      <div class="drawer-header">
        <button class="drawer-close" id="drawer-close" aria-label="Close details">✕</button>
        <div id="drawer-header-content"></div>
      </div>
      <div class="drawer-body" id="drawer-body-content"></div>
    </div>
  </dialog>

  <script src="roadmap-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
