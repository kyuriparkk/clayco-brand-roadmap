<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clayco Brand Roadmap</title>
  <meta name="description" content="Live tracker for the Clayco enterprise brand project — research, strategy, design system, website, guidelines, implementation, and launch." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <h1>Clayco Brand Roadmap</h1>
      <p class="sub">
        A live look at where the enterprise brand project stands — from research
        through launch. Click any stage on the timeline for detail.
      </p>
      <div class="legend">
        <span class="dot"><span class="swatch done"></span>Complete</span>
        <span class="dot"><span class="swatch active"></span>In progress</span>
        <span class="dot"><span class="swatch todo"></span>Not started</span>
      </div>
    </div>
  </header>

  <section class="overview">
    <div class="wrap">
      <div class="overview-head">
        <h2>Timeline</h2>
        <span class="months-badge"><strong id="months-count"></strong> months</span>
      </div>
      <div class="gantt" id="gantt"></div>
      <button class="ongoing-trigger" id="ongoing-trigger">
        Brand Governance &amp; Measurement — ongoing <span class="arrow">→</span>
      </button>
    </div>
  </section>

  <footer class="site">
    <div class="wrap">
      Last updated <span id="updated"></span> · edit <code>roadmap-data.js</code> and push to update this page.
    </div>
  </footer>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="roadmap-data.js"></script>
  <script src="script.js"></script>
  <script>document.getElementById("months-count").textContent = ROADMAP.months;</script>
</body>
</html>
